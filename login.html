<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ورود | LA3</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at top,#102a49,#050505 55%);
  color:white;
  font-family:Tahoma,Arial,sans-serif;
}

.box{
  width:min(430px,92%);
  background:rgba(17,24,39,.96);
  border:1px solid #2563eb;
  border-radius:30px;
  padding:28px 22px;
  box-shadow:0 0 35px rgba(37,99,235,.28);
}

.logo{
  text-align:center;
  font-size:58px;
  font-weight:900;
  color:#38bdf8;
  text-shadow:0 0 25px #2563eb;
}

.subtitle{
  text-align:center;
  color:#94a3b8;
  font-size:13px;
  margin:5px 0 25px;
}

label{
  display:block;
  margin:15px 4px 7px;
  color:#bfdbfe;
  font-size:13px;
}

input{
  width:100%;
  border:1px solid #334155;
  outline:none;
  background:#080d15;
  color:#fff;
  border-radius:17px;
  padding:14px;
  font-family:inherit;
  font-size:14px;
}

input:focus{
  border-color:#38bdf8;
  box-shadow:0 0 12px rgba(56,189,248,.18);
}

.avatar-area{
  text-align:center;
  margin:10px 0 15px;
}

.avatar-preview{
  width:82px;
  height:82px;
  margin:auto;
  border-radius:50%;
  background:#1d4ed8;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:30px;
  border:2px solid #38bdf8;
}

.avatar-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.file{
  margin-top:10px;
  color:#93c5fd;
  font-size:11px;
}

button{
  width:100%;
  border:0;
  border-radius:18px;
  padding:15px;
  margin-top:20px;
  background:#2563eb;
  color:#fff;
  font-family:inherit;
  font-size:15px;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  min-height:20px;
  text-align:center;
  margin-top:15px;
  font-size:12px;
  color:#93c5fd;
}

.owner{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#60a5fa;
  text-decoration:none;
  font-size:12px;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">LA3</div>

  <div class="subtitle">
    ورود به شبکه اجتماعی LA3
  </div>


  <!-- عکس پروفایل -->

  <div class="avatar-area">

    <div class="avatar-preview" id="avatarPreview">
      👤
    </div>

    <input
      class="file"
      id="avatarInput"
      type="file"
      accept="image/*"
    >

  </div>


  <!-- نام -->

  <label for="name">
    نام
  </label>

  <input
    id="name"
    type="text"
    maxlength="50"
    placeholder="نام خود را وارد کنید"
    autocomplete="name"
  >


  <!-- نام کاربری -->

  <label for="username">
    نام کاربری
  </label>

  <input
    id="username"
    type="text"
    maxlength="30"
    placeholder="مثلاً LA3User"
    autocomplete="username"
  >


  <!-- ایمیل -->

  <label for="email">
    ایمیل
  </label>

  <input
    id="email"
    type="email"
    placeholder="example@email.com"
    autocomplete="email"
  >


  <!-- رمز -->

  <label for="password">
    رمز عبور
  </label>

  <input
    id="password"
    type="password"
    minlength="6"
    placeholder="حداقل ۶ کاراکتر"
    autocomplete="new-password"
  >


  <button id="loginButton">
    ورود / ساخت حساب
  </button>


  <div id="message" class="message"></div>


  <a class="owner" href="owner-login.html">
    🔐 ورود مالک LA3
  </a>

</div>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================
   SUPABASE
   ========================================= */

const SUPABASE_URL =
"https://ibqhyqzolkzzpziocfvp.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"کلید Publishable قبلی خودت را اینجا قرار بده";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   ELEMENTS
   ========================================= */

const nameInput =
document.getElementById("name");

const usernameInput =
document.getElementById("username");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const avatarInput =
document.getElementById("avatarInput");

const avatarPreview =
document.getElementById("avatarPreview");

const loginButton =
document.getElementById("loginButton");

const messageBox =
document.getElementById("message");


let selectedAvatar = null;


/* =========================================
   MESSAGE
   ========================================= */

function showMessage(text, error=false){

  messageBox.textContent = text;

  messageBox.style.color =
    error ? "#fca5a5" : "#93c5fd";

}


/* =========================================
   AVATAR PREVIEW
   ========================================= */

avatarInput.addEventListener(
  "change",
  function(){

    const file =
      this.files[0];

    if(!file){
      return;
    }

    if(!file.type.startsWith("image/")){

      showMessage(
        "لطفاً یک عکس انتخاب کن.",
        true
      );

      return;
    }

    const reader =
      new FileReader();

    reader.onload =
      function(event){

        selectedAvatar =
          event.target.result;

        avatarPreview.innerHTML =
          `<img src="${selectedAvatar}" alt="پروفایل">`;

      };

    reader.readAsDataURL(file);

  }
);


/* =========================================
   NORMALIZE USERNAME
   ========================================= */

function normalizeUsername(value){

  return value
    .trim()
    .replace(/^@/,"")
    .toLowerCase();

}


/* =========================================
   SAVE PROFILE
   ========================================= */

async function saveProfile(user){

  const name =
    nameInput.value.trim();

  const username =
    normalizeUsername(
      usernameInput.value
    );


  if(!name || !username){

    throw new Error(
      "نام و نام کاربری الزامی است."
    );

  }


  const profileData = {

    id:user.id,

    name:name,

    username:username

  };


  const { error } =
    await supabaseClient
      .from("profiles")
      .upsert(
        profileData,
        {
          onConflict:"id"
        }
      );


  if(error){

    console.error(error);

    throw new Error(
      "ذخیره پروفایل انجام نشد."
    );

  }


  /*
   * فعلاً اطلاعاتی که قبلاً سایت استفاده می‌کرد
   * در localStorage هم نگه می‌داریم.
   */

  localStorage.setItem(
    "la3_name",
    name
  );

  localStorage.setItem(
    "la3_username",
    username
  );


  if(selectedAvatar){

    localStorage.setItem(
      "la3_avatar",
      selectedAvatar
    );

  }

}


/* =========================================
   LOGIN / SIGN UP
   ========================================= */

loginButton.addEventListener(
  "click",
  async function(){

    const name =
      nameInput.value.trim();

    const username =
      normalizeUsername(
        usernameInput.value
      );

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    if(!name){

      showMessage(
        "نام را وارد کن.",
        true
      );

      return;
    }


    if(!username){

      showMessage(
        "نام کاربری را وارد کن.",
        true
      );

      return;
    }


    if(!email){

      showMessage(
        "ایمیل را وارد کن.",
        true
      );

      return;
    }


    if(password.length < 6){

      showMessage(
        "رمز عبور باید حداقل ۶ کاراکتر باشد.",
        true
      );

      return;
    }


    loginButton.disabled = true;

    showMessage(
      "در حال ورود..."
    );


    try{

      /*
       * ابتدا تلاش برای ورود
       */

      let {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({

          email:email,

          password:password

        });


      /*
       * اگر حساب وجود نداشت،
       * حساب جدید ساخته می‌شود.
       */

      if(error){

        const signUp =
          await supabaseClient.auth.signUp({

            email:email,

            password:password

          });


        if(signUp.error){

          throw signUp.error;

        }


        data =
          signUp.data;


        /*
         * اگر تأیید ایمیل فعال باشد،
         * ممکن است session فعلاً null باشد.
         */

        if(!data.session){

          showMessage(
            "حساب ساخته شد. اگر تأیید ایمیل فعال باشد، ایمیل خود را تأیید کن و سپس وارد شو."
          );

          loginButton.disabled = false;

          return;
        }

      }


      if(!data.user){

        throw new Error(
          "کاربر دریافت نشد."
        );

      }


      /*
       * ذخیره پروفایل
       */

      await saveProfile(
        data.user
      );


      showMessage(
        "ورود موفق بود؛ در حال انتقال..."
      );


      setTimeout(
        function(){

          window.location.href =
            "index.html";

        },
        500
      );

    }
    catch(error){

      console.error(error);

      showMessage(
        error.message ||
        "خطایی رخ داد.",
        true
      );

      loginButton.disabled = false;

    }

  }
);


/* =========================================
   CHECK EXISTING SESSION
   ========================================= */

async function checkSession(){

  const {
    data
  } =
    await supabaseClient.auth.getSession();


  if(data.session){

    window.location.href =
      "index.html";

  }

}


checkSession();

</script>

</body>
</html>
