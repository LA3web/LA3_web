<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;

  display:flex;
  justify-content:center;
  align-items:center;

<body>

<div class="box">

  <div class="logo">

  <div class="subtitle">
    ورود به شبکه اجتماعی LA3

  <input

  <label for="username">
    نام کاربری
  </label>

  </label>

    id="message"
    class="message"
  ></div>

<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://ibqhyqzolkzzpziocfvp.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_vOId9lF-lt6wa4NdOdzDXg_ZRRelWUh";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   ELEMENTS
========================================= */

const displayNameInput =
document.getElementById("displayName");

const usernameInput =
document.getElementById("username");

const passwordInput =
document.getElementById("password");

const avatarInput =
document.getElementById("avatarInput");

const avatarPreview =
document.getElementById("avatarPreview");

const loginButton =
document.getElementById("loginButton");

const messageBox =
document.getElementById("message");


let selectedAvatar = null;


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,error=false){

  messageBox.textContent = text;

  messageBox.style.color =
    error ? "#fca5a5" : "#93c5fd";

}


/* =========================================
   AVATAR
========================================= */

avatarInput.addEventListener(
  "change",
  function(){

    const file =
    this.files[0];

    if(!file){
      return;
    }

    if(!file.type.startsWith("image/")){

      showMessage(
        "لطفاً یک عکس انتخاب کن.",
        true
      );

      this.value = "";

      return;
    }

    const reader =
    new FileReader();

    reader.onload =
    function(event){

      selectedAvatar =
      event.target.result;

      avatarPreview.innerHTML =
      `<img src="${selectedAvatar}" alt="پروفایل">`;

    };

    reader.readAsDataURL(file);

  }
);


/* =========================================
   USERNAME
========================================= */

function normalizeUsername(value){

  return value
    .trim()
    .replace(/^@/,"")
    .toLowerCase();

}


/* =========================================
   INTERNAL AUTH EMAIL
========================================= */

function makeInternalEmail(username){

  return (
    normalizeUsername(username)
    .replace(/[^a-z0-9._-]/g,"")
    +
    "@la3.internal"
  );

}


/* =========================================
   CHECK USERNAME
========================================= */

async function usernameExists(username){

  const {
    data,
    error
  } =
  await supabaseClient
    .rpc(
      "username_exists",
      {
        requested_username:username
      }
    );

  if(error){

    console.error(
      "Username check error:",
      error
    );

    throw new Error(
      "بررسی نام کاربری انجام نشد."
    );

  }

  return data === true;

}


/* =========================================
   SAVE PROFILE
========================================= */

async function saveProfile(user){

  const displayName =
  displayNameInput.value.trim();

  const username =
  normalizeUsername(
    usernameInput.value
  );


  const profileData = {

    id:user.id,

    username:username,

    display_name:displayName

  };


  const {
    error
  } =
  await supabaseClient
    .from("profiles")
    .upsert(
      profileData,
      {
        onConflict:"id"
      }
    );


  if(error){

    console.error(
      "Profile error:",
      error
    );

    throw new Error(
      "ذخیره اطلاعات حساب انجام نشد."
    );

  }


  localStorage.setItem(
    "la3_name",
    displayName
  );

  localStorage.setItem(
    "la3_username",
    username
  );


  if(selectedAvatar){

    localStorage.setItem(
      "la3_avatar",
      selectedAvatar
    );

  }

}


/* =========================================
   LOGIN / CREATE
========================================= */

async function loginOrCreate(){

  const displayName =
  displayNameInput.value.trim();

  const username =
  normalizeUsername(
    usernameInput.value
  );

  const password =
  passwordInput.value;


  /* نام */

  if(!displayName){

    showMessage(
      "نام را وارد کن.",
      true
    );

    displayNameInput.focus();

    return;

  }


  /* نام کاربری */

  if(!username){

    showMessage(
      "نام کاربری را وارد کن.",
      true
    );

    usernameInput.focus();

    return;

  }


  if(username.length < 3){

    showMessage(
      "نام کاربری باید حداقل ۳ کاراکتر باشد.",
      true
    );

    usernameInput.focus();

    return;

  }


  /* رمز */

  if(password.length < 6){

    showMessage(
      "رمز عبور باید حداقل ۶ کاراکتر باشد.",
      true
    );

    passwordInput.focus();

    return;

  }


  loginButton.disabled = true;

  loginButton.textContent =
  "در حال بررسی...";

  showMessage(
    "در حال ورود..."
  );


  try{

    /*
     * ایمیل داخلی فقط برای Supabase Auth است.
     * کاربر آن را نمی‌بیند.
     */

    const internalEmail =
    makeInternalEmail(username);


    /*
     * اول بررسی می‌کنیم این نام کاربری
     * قبلاً در profiles ثبت شده یا نه.
     */

    const exists =
    await usernameExists(
      username
    );


    /* =====================================
       حساب موجود است → ورود
    ===================================== */

    if(exists){

      const {
        data,
        error
      } =
      await supabaseClient.auth
        .signInWithPassword({

          email:internalEmail,

          password:password

        });


      if(error){

        console.error(
          "Login error:",
          error
        );

        throw new Error(
          "نام کاربری یا رمز عبور اشتباه است."
        );

      }


      if(!data.user){

        throw new Error(
          "حساب کاربر پیدا نشد."
        );

      }


      await saveProfile(
        data.user
      );


      showMessage(
        "ورود موفق بود؛ در حال ورود به LA3..."
      );


      setTimeout(
        function(){

          window.location.href =
          "index.html";

        },
        500
      );


      return;

    }


    /* =====================================
       حساب وجود ندارد → ساخت حساب
    ===================================== */

    showMessage(
      "در حال ساخت حساب..."
    );


    const {
      data,
      error
    } =
    await supabaseClient.auth
      .signUp({

        email:internalEmail,

        password:password

      });


    if(error){

      console.error(
        "Signup error:",
        error
      );

      throw new Error(
        error.message ||
        "ساخت حساب انجام نشد."
      );

    }


    if(!data.user){

      throw new Error(
        "ساخت حساب انجام نشد."
      );

    }


    /*
     * اگر Supabase تأیید ایمیل را بخواهد،
     * چون ایمیل داخلی قابل دریافت توسط کاربر نیست،
     * ورود نمی‌تواند ادامه پیدا کند.
     */

    if(!data.session){

      throw new Error(
        "تأیید ایمیل در Supabase فعال است. برای ورود بدون ایمیل باید Email Confirmation را در تنظیمات Auth غیرفعال کنیم."
      );

    }


    /*
     * ذخیره پروفایل
     */

    await saveProfile(
      data.user
    );


    showMessage(
      "حساب با موفقیت ساخته شد؛ در حال ورود..."
    );


    setTimeout(
      function(){

        window.location.href =
        "index.html";

      },
      700
    );

  }
  catch(error){

    console.error(
      "LA3 AUTH ERROR:",
      error
    );

    showMessage(
      error.message ||
      "خطایی رخ داد.",
      true
    );

    loginButton.disabled =
    false;

    loginButton.textContent =
    "ورود / ساخت حساب";

  }

}


/* =========================================
   BUTTON
========================================= */

loginButton.addEventListener(
  "click",
  loginOrCreate
);


/* =========================================
   ENTER
========================================= */

passwordInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      loginOrCreate();

    }

  }
);


/* =========================================
   EXISTING SESSION
========================================= */

async function checkSession(){

  try{

    const {
      data
    } =
    await supabaseClient.auth
      .getSession();


    if(data.session){

      window.location.href =
      "index.html";

    }

  }
  catch(error){

    console.error(
      "Session error:",
      error
    );

  }

}


checkSession();

</script>

</body>
</html>
