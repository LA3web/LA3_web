<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
  "https://ibqhyqzolkzzpziocfvp.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_vOId9lF-lt6wa4NdOdzDXg_ZRRelWUh";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =====================================
   CHECK OWNER
===================================== */

async function checkOwnerLogin(){

  const ownerEmail =
    document.getElementById("ownerEmail");

  const securityStatus =
    document.getElementById("securityStatus");


  ownerEmail.textContent =
    "در حال بررسی حساب مالک...";

  securityStatus.textContent =
    "در حال بررسی دسترسی مالک...";


  /* گرفتن کاربر واردشده */

  const {
    data: userData,
    error: userError
  } =
    await supabaseClient.auth.getUser();


  /* اگر وارد نشده */

  if(
    userError ||
    !userData ||
    !userData.user
  ){

    window.location.href =
      "owner-login.html";

    return;
  }


  const user =
    userData.user;


  /* =====================================
     بررسی Owner در دیتابیس
  ===================================== */

  const {
    data: ownerData,
    error: ownerError
  } =
    await supabaseClient
      .from("owner_accounts")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();


  /* خطای بررسی مالک */

  if(ownerError){

    console.error(
      "Owner check error:",
      ownerError
    );

    securityStatus.textContent =
      "خطا در بررسی دسترسی مالک.";

    alert(
      "خطا در بررسی حساب مالک. لطفاً دوباره تلاش کنید."
    );

    window.location.href =
      "owner-login.html";

    return;
  }


  /* =====================================
     کاربر Owner نیست
  ===================================== */

  if(!ownerData){

    securityStatus.textContent =
      "⛔ این حساب اجازه ورود به پنل مالک را ندارد.";

    alert(
      "⛔ دسترسی غیرمجاز\n\nاین حساب مالک LA3 نیست."
    );

    await supabaseClient.auth.signOut();

    window.location.href =
      "owner-login.html";

    return;
  }


  /* =====================================
     مالک تأیید شد
  ===================================== */

  ownerEmail.textContent =
    "👑 " + (user.email || "مالک LA3");


  securityStatus.innerHTML =
    "✅ حساب مالک با موفقیت احراز هویت شد.<br>" +
    "🔐 دسترسی پنل مدیریت فعال است.<br>" +
    "👑 فقط حساب مالک می‌تواند این پنل را مشاهده کند.";


  console.log(
    "LA3 Owner verified:",
    user.email
  );

}


/* =====================================
   LOGOUT
===================================== */

document
  .getElementById("logout")
  .addEventListener(
    "click",
    async function(){

      const {
        error
      } =
        await supabaseClient.auth.signOut();


      if(error){

        console.error(
          "Logout error:",
          error
        );

        alert(
          "خروج انجام نشد. دوباره تلاش کنید."
        );

        return;
      }


      window.location.href =
        "owner-login.html";

    }
  );


/* =====================================
   TEMP BUTTONS
===================================== */

function notReady(section){

  alert(
    "بخش «" +
    section +
    "» در مرحله بعد به Supabase متصل می‌شود. 💙"
  );

}


/* =====================================
   SCROLL
===================================== */

function scrollToTop(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================
   START
===================================== */

checkOwnerLogin();

</script>
