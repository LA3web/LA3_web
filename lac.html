<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LA3 LAC</title>

<style>
body{
margin:0;
background:#050505;
color:white;
font-family:tahoma;
}

.container{
max-width:450px;
margin:auto;
padding:20px;
}

.logo{
text-align:center;
font-size:45px;
font-weight:bold;
color:#38bdf8;
text-shadow:0 0 20px #2563eb;
}

.card{
background:#111827;
border-radius:30px;
padding:20px;
margin-top:20px;
border:1px solid #7c3aed;
box-shadow:0 0 20px #2563eb;
}

.channel{
display:flex;
align-items:center;
gap:15px;
}

.img{
width:60px;
height:60px;
border-radius:50%;
background:#2563eb;
}

.name{
font-size:20px;
color:#60a5fa;
}

.tick{
color:#38bdf8;
}

.info{
color:#aaa;
}

.bottom{
position:fixed;
bottom:15px;
left:20px;
right:20px;
background:#111827;
border-radius:35px;
padding:15px;
display:flex;
justify-content:space-around;
border:1px solid #38bdf8;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
LAC
</div>


<div class="card channel">

<div class="img"></div>

<div>

کانال رسمی مالک
</div>

</div>

</div>


<div class="card channel">

<div class="img"></div>

<div>

<div class="name">
News Channel
</div>

<div class="info">
کانال خبری LAC
</div>

</div>

</div>


<div class="card channel">

<div class="img"></div>

<div>

<div class="name">
Gaming Channel
</div>

<div class="info">
کانال بازی و سرگرمی
</div>

</div>

</div>


</div>


<div class="bottom">

<div>🏠</div>
<div>📺 LAC</div>
<div>💬 چت</div>
<div>⚙️</div>

</div>
