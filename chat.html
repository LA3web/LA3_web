<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>چت | LA3</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
}

body{
  background:#050505;
  color:#fff;
  font-family:Tahoma,Arial,sans-serif;
}

.app{
  max-width:600px;
  height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
  background:#080b10;
}

/* Header */

.header{
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#0d1118;
  border-bottom:1px solid #1d4ed8;
  box-shadow:0 0 18px rgba(37,99,235,.25);
}

.header-title{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:45px;
  height:45px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#2563eb;
  color:white;
  font-size:18px;
  font-weight:bold;
  box-shadow:0 0 15px rgba(37,99,235,.55);
}

.header h2{
  margin:0;
  font-size:18px;
}

.header p{
  margin:4px 0 0;
  color:#93c5fd;
  font-size:12px;
}

.back{
  color:#93c5fd;
  text-decoration:none;
  font-size:14px;
}

/* Messages */

.messages{
  flex:1;
  overflow-y:auto;
  padding:18px 14px 100px;
}

.empty{
  text-align:center;
  color:#64748b;
  margin-top:45%;
}

.message{
  display:flex;
  margin:10px 0;
}

.message.mine{
  justify-content:flex-start;
}

.message.other{
  justify-content:flex-end;
}

.bubble{
  max-width:78%;
  padding:11px 14px;
  border-radius:18px;
  background:#111827;
  border:1px solid #1e3a8a;
  box-shadow:0 4px 15px rgba(0,0,0,.25);
}

.mine .bubble{
  background:#1d4ed8;
  border-color:#2563eb;
}

.username{
  font-size:11px;
  color:#7dd3fc;
  margin-bottom:5px;
}

.mine .username{
  color:#dbeafe;
}

.text{
  font-size:15px;
  line-height:1.7;
  word-break:break-word;
}

.time{
  font-size:9px;
  color:#94a3b8;
  margin-top:5px;
}

.mine .time{
  color:#dbeafe;
}

/* Input */

.composer{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(600px,100%);
  padding:12px;
  background:rgba(8,11,16,.95);
  backdrop-filter:blur(12px);
  border-top:1px solid #1e3a8a;
}

.form{
  display:flex;
  gap:8px;
}

.input{
  flex:1;
  min-width:0;
  border:1px solid #334155;
  outline:none;
  background:#111827;
  color:#fff;
  border-radius:22px;
  padding:13px 16px;
  font-size:14px;
}

.input:focus{
  border-color:#38bdf8;
  box-shadow:0 0 12px rgba(56,189,248,.2);
}

.send{
  width:52px;
  border:0;
  border-radius:20px;
  background:#2563eb;
  color:white;
  font-size:20px;
  cursor:pointer;
}

.send:active{
  transform:scale(.95);
}

.status{
  text-align:center;
  color:#64748b;
  font-size:10px;
  margin-top:7px;
}

/* Mobile */

@media(max-width:450px){
  .bubble{
    max-width:85%;
  }

  .header{
    padding:12px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="header-title">

      <div class="logo">LA3</div>

      <div>
        <h2>چت LA3 💬</h2>
        <p id="onlineText">در حال اتصال...</p>
      </div>

    </div>

    <a class="back" href="index.html">خانه</a>

  </header>


  <main id="messages" class="messages">

    <div id="empty" class="empty">
      هنوز پیامی ارسال نشده 💙
    </div>

  </main>


  <div class="composer">

    <form id="messageForm" class="form">

      <input
        id="messageInput"
        class="input"
        type="text"
        maxlength="1000"
        autocomplete="off"
        placeholder="پیامت را بنویس..."
      >

      <button class="send" type="submit">
        ➤
      </button>

    </form>

    <div id="status" class="status">
      اتصال به چت...
    </div>

  </div>

</div>


<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================
   LA3 SUPABASE CONFIG
   ========================================= */

const SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"YOUR_PUBLISHABLE_KEY";


const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   ELEMENTS
   ========================================= */

const messagesBox =
  document.getElementById("messages");

const emptyBox =
  document.getElementById("empty");

const form =
  document.getElementById("messageForm");

const input =
  document.getElementById("messageInput");

const statusBox =
  document.getElementById("status");

const onlineText =
  document.getElementById("onlineText");


/* =========================================
   CURRENT USER
   ========================================= */

let currentUser = null;


/* =========================================
   FORMAT TIME
   ========================================= */

function formatTime(date){

  return new Intl.DateTimeFormat(
    "fa-IR",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  ).format(new Date(date));

}


/* =========================================
   ADD MESSAGE TO SCREEN
   ========================================= */

function addMessage(message){

  emptyBox.style.display = "none";

  const wrapper =
    document.createElement("div");

  const isMine =
    currentUser &&
    message.user_id === currentUser.id;

  wrapper.className =
    "message " +
    (isMine ? "mine" : "other");


  const bubble =
    document.createElement("div");

  bubble.className = "bubble";


  const username =
    document.createElement("div");

  username.className = "username";

  username.textContent =
    message.username || "کاربر";


  const text =
    document.createElement("div");

  text.className = "text";

  text.textContent =
    message.message;


  const time =
    document.createElement("div");

  time.className = "time";

  time.textContent =
    formatTime(message.created_at);


  bubble.appendChild(username);
  bubble.appendChild(text);
  bubble.appendChild(time);

  wrapper.appendChild(bubble);

  messagesBox.appendChild(wrapper);

  messagesBox.scrollTop =
    messagesBox.scrollHeight;
}


/* =========================================
   LOAD OLD MESSAGES
   ========================================= */

async function loadMessages(){

  const { data, error } =
    await supabaseClient
      .from("messages")
      .select("*")
      .order("created_at", {
        ascending:true
      })
      .limit(100);


  if(error){

    console.error(error);

    statusBox.textContent =
      "خطا در دریافت پیام‌ها";

    return;
  }


  messagesBox
    .querySelectorAll(".message")
    .forEach(el => el.remove());


  if(!data || data.length === 0){

    emptyBox.style.display =
      "block";

    return;
  }


  emptyBox.style.display =
    "none";


  data.forEach(addMessage);

}


/* =========================================
   REALTIME
   ========================================= */

function startRealtime(){

  supabaseClient
    .channel("la3-chat")
    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"messages"
      },
      payload => {

        addMessage(payload.new);

      }
    )
    .subscribe(status => {

      if(status === "SUBSCRIBED"){

        statusBox.textContent =
          "چت آنلاین است 💙";

        onlineText.textContent =
          "آنلاین";

      }

    });

}


/* =========================================
   SEND MESSAGE
   ========================================= */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    const text =
      input.value.trim();


    if(!text){
      return;
    }


    if(!currentUser){

      alert(
        "ابتدا باید وارد حساب خود شوی."
      );

      return;
    }


    const username =
      localStorage.getItem(
        "la3_username"
      ) || "کاربر";


    const { error } =
      await supabaseClient
        .from("messages")
        .insert({

          user_id:
            currentUser.id,

          username:
            username,

          message:
            text

        });


    if(error){

      console.error(error);

      alert(
        "ارسال پیام انجام نشد."
      );

      return;
    }


    input.value = "";

  }
);


/* =========================================
   INIT
   ========================================= */

async function init(){

  const {
    data
  } = await supabaseClient.auth.getUser();


  currentUser =
    data.user || null;


  if(!currentUser){

    statusBox.textContent =
      "وارد حساب نشده‌ای";

    onlineText.textContent =
      "نیاز به ورود";

    return;
  }


  await loadMessages();

  startRealtime();

}


init();

</script>

</body>
  </html>
