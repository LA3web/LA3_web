<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LA3</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#050505;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
    min-height:100vh
}

.hidden{display:none!important}

.glow{
    color:#ff1744;
    text-shadow:0 0 8px #ff1744,0 0 22px #ff1744
}

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:radial-gradient(circle at 50% 30%,#151515,#000 70%)
}

.login-card{
    width:min(430px,94vw);
    padding:28px 22px;
    border:2px solid #00aaff;
    border-radius:22px;
    box-shadow:0 0 12px #00aaff,0 0 35px #004dff55;
    background:#080808
}

.logo{
    text-align:center;
    font-size:48px;
    font-weight:900;
    letter-spacing:5px;
    color:#ff1744;
    text-shadow:0 0 8px #ff1744,0 0 28px #ff1744;
    margin:0 0 8px
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:28px
}

.field{margin:15px 0}

.field label{
    display:block;
    margin-bottom:7px;
    color:#ddd;
    font-size:14px
}

.field input,
textarea{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #00aaff;
    background:#050505;
    color:#fff;
    outline:none;
    font-family:inherit
}

.field input:focus,
textarea:focus{
    box-shadow:0 0 12px #00aaff
}

.btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#ff1744;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 12px #ff1744;
    margin-top:10px
}

.btn:hover{filter:brightness(1.15)}

.notice{
    text-align:center;
    color:#ff607b;
    min-height:22px;
    margin-top:12px;
    font-size:13px
}

.app{min-height:100vh}

header{
    position:sticky;
    top:0;
    z-index:10;
    background:#050505ee;
    border-bottom:1px solid #ff174455;
    backdrop-filter:blur(10px);
    padding:14px
}

.header-inner{
    max-width:1000px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px
}

.brand{
    font-size:30px;
    font-weight:900;
    color:#ff1744;
    text-shadow:0 0 10px #ff1744
}

.userbox{
    font-size:13px;
    color:#bbb;
    flex:1;
    text-align:center
}

.admin-btn{
    width:auto;
    padding:9px 14px;
    margin:0;
    font-size:13px
}

main{
    max-width:1000px;
    margin:auto;
    padding:18px
}

.ad-box{
    border:1px solid #00aaff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 0 18px #00aaff44;
    background:#080808
}

.ad-slide{
    display:none;
    position:relative;
    height:210px
}

.ad-slide.active{display:block}

.ad-slide img{
    width:100%;
    height:100%;
    object-fit:cover
}

.ad-caption{
    position:absolute;
    bottom:0;
    right:0;
    left:0;
    padding:14px;
    background:linear-gradient(transparent,#000d);
    font-weight:bold
}

.dots{
    text-align:center;
    padding:9px
}

.dot{
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#555;
    margin:0 4px
}

.dot.active{
    background:#00aaff;
    box-shadow:0 0 8px #00aaff
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-top:18px
}

.panel{
    background:#080808;
    border:1px solid #ff174466;
    border-radius:18px;
    padding:16px;
    box-shadow:0 0 18px #ff174422
}

.panel h2{
    margin:0 0 15px;
    color:#00aaff;
    text-shadow:0 0 8px #00aaff;
    font-size:20px
}

.compose textarea{
    min-height:85px;
    resize:vertical
}

.compose-actions{
    display:flex;
    gap:8px;
    margin-top:8px
}

.small-btn{
    padding:10px 13px;
    border-radius:10px;
    border:1px solid #00aaff;
    background:#071019;
    color:#fff;
    cursor:pointer;
    font-family:inherit
}

.small-btn:hover{
    box-shadow:0 0 10px #00aaff55
}

.feed{
    max-height:440px;
    overflow:auto;
    margin-top:12px
}

.item{
    border-top:1px solid #222;
    padding:13px 4px
}

.item:first-child{border-top:0}

.meta{
    font-size:12px;
    color:#888;
    margin-bottom:7px
}

.verified{
    color:#00aaff;
    text-shadow:0 0 7px #00aaff
}

.message{
    white-space:pre-wrap;
    line-height:1.8
}

.empty{
    text-align:center;
    color:#666;
    padding:25px
}

.admin-page{
    padding:18px;
    min-height:100vh
}

.admin-panel{
    max-width:1000px;
    margin:auto;
    border:1px solid #00aaff;
    border-radius:18px;
    padding:18px;
    box-shadow:0 0 20px #00aaff33;
    background:#080808
}

.admin-list{margin-top:15px}

.user-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px;
    border-bottom:1px solid #222
}

.row-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap
}

.danger{
    border-color:#ff1744;
    background:#16050a
}

.green{
    border-color:#00e676;
    background:#04150c
}

.back{margin-bottom:15px}

.status{
    text-align:center;
    color:#888;
    margin-top:8px;
    font-size:12px
}

.file-name{
    color:#aaa;
    font-size:12px;
    margin-top:5px;
    overflow:hidden;
    text-overflow:ellipsis
}

@media(max-width:700px){
    .grid{grid-template-columns:1fr}
    .header-inner{flex-wrap:wrap}
    .brand{font-size:25px}
    .ad-slide{height:170px}
    .userbox{
        order:3;
        flex-basis:100%
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginPage" class="login-page">
<div class="login-card">

    <div class="logo">LA3</div>
    <div class="subtitle">به سامانه LA3 خوش آمدید</div>

    <div class="field">
        <label for="name">نام خود را وارد کنید</label>
        <input id="name" type="text" maxlength="40" placeholder="نام شما">
    </div>

    <div class="field">
        <label for="username">نام کاربری</label>
        <input id="username" type="text" maxlength="30" placeholder="@username">
    </div>

    <button id="registerBtn" class="btn" type="button">
        ثبت
    </button>

    <div id="loginNotice" class="notice"></div>

</div>
</section>


<!-- APP -->
<section id="app" class="app hidden">

<header>
<div class="header-inner">

    <div class="brand">LA3</div>

    <div class="userbox" id="currentUser"></div>

    <button id="adminButton"
            class="btn admin-btn hidden"
            type="button">
        مدیریت
    </button>

</div>
</header>

<main>

<!-- ADS -->
<div class="ad-box">

    <div class="ad-slide active">
        <img src="https://picsum.photos/1200/500?random=31" alt="تبلیغ">
        <div class="ad-caption">
            تبلیغ شماره ۱
        </div>
    </div>

    <div class="ad-slide">
        <img src="https://picsum.photos/1200/500?random=32" alt="تبلیغ">
        <div class="ad-caption">
            تبلیغ شماره ۲
        </div>
    </div>

    <div class="ad-slide">
        <img src="https://picsum.photos/1200/500?random=33" alt="تبلیغ">
        <div class="ad-caption">
            تبلیغ شماره ۳
        </div>
    </div>

    <div class="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>

</div>


<div class="grid">

<!-- TWEETS -->
<section class="panel">

    <h2>🐦 توییت‌ها</h2>

    <div class="compose">

        <textarea
            id="tweetInput"
            placeholder="چه خبر؟">
        </textarea>

        <div class="compose-actions">

            <button
                id="tweetSendBtn"
                class="small-btn"
                type="button">
                ارسال
            </button>

            <button
                id="tweetImageBtn"
                class="small-btn"
                type="button">
                📷 عکس
            </button>

            <input
                id="tweetImageInput"
                type="file"
                accept="image/*"
                hidden>

        </div>

        <div id="tweetFileName" class="file-name"></div>

    </div>

    <div id="tweetFeed" class="feed"></div>

</section>


<!-- CHAT -->
<section class="panel">

    <h2>💬 چتروم</h2>

    <div style="color:#aaa;line-height:1.9;margin-bottom:12px">
        برای گفتگو با کاربران وارد صفحه اختصاصی چتروم شوید.
    </div>

    <button
        id="openChatBtn"
        class="btn"
        type="button">
        ورود به چتروم
    </button>

</section>

</div>
</main>
</section>


<!-- CHATROOM -->
<section id="chatroomPage" class="admin-page hidden">

<div class="admin-panel" style="max-width:850px">

    <button
        id="closeChatBtn"
        class="small-btn back"
        type="button">
        ← بازگشت
    </button>

    <h2 class="glow">💬 چتروم LA3</h2>

    <div
        id="chatFeed"
        class="feed"
        style="max-height:55vh;margin-bottom:14px">
    </div>

    <div class="compose">

        <textarea
            id="chatInput"
            placeholder="پیام خود را بنویسید...">
        </textarea>

        <div class="compose-actions">

            <button
                id="chatSendBtn"
                class="small-btn"
                type="button">
                ارسال پیام
            </button>

        </div>

    </div>

</div>
</section>


<!-- ADMIN -->
<section id="adminPage" class="admin-page hidden">

<div class="admin-panel">

    <button
        id="backAdminBtn"
        class="small-btn back"
        type="button">
        ← بازگشت
    </button>

    <h2 class="glow">پنل مدیریت LA3</h2>

    <p style="color:#aaa">
        مدیریت کاربران
    </p>

    <div id="adminUsers" class="admin-list"></div>

</div>
</section>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
"https://ibqhyqzolkzzpziocfvp.supabase.co/rest/v1/";

const SUPABASE_KEY =
"sb_publishable_vOId9lF-lt6wa4NdOdzDXg_ZRRelWUh";

const sb =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==============================
   GLOBAL
============================== */

let currentUser = null;
let tweets = [];
let chats = [];
let realtimeChannel = null;


/* ==============================
   ELEMENTS
============================== */

const loginPage =
document.getElementById("loginPage");

const app =
document.getElementById("app");

const chatroomPage =
document.getElementById("chatroomPage");

const adminPage =
document.getElementById("adminPage");

const loginNotice =
document.getElementById("loginNotice");


/* ==============================
   CLEAN
============================== */

function clean(text){

    const div =
    document.createElement("div");

    div.textContent =
    String(text ?? "");

    return div.innerHTML;
}


/* ==============================
   LOGIN
============================== */

async function registerUser(){

    const name =
    document.getElementById("name")
    .value
    .trim();

    const username =
    document.getElementById("username")
    .value
    .trim()
    .replace(/^@/,"")
    .toLowerCase();

    loginNotice.textContent = "";

    if(!name || !username){

        loginNotice.textContent =
        "لطفاً نام و نام کاربری را وارد کنید.";

        return;
    }

    if(username.length < 3){

        loginNotice.textContent =
        "نام کاربری باید حداقل ۳ حرف باشد.";

        return;
    }

    loginNotice.textContent =
    "در حال اتصال به LA3...";

    const button =
    document.getElementById("registerBtn");

    button.disabled = true;
    button.textContent = "در حال ورود...";

    try{

        /* دریافت session فعلی */
        let sessionResult =
        await sb.auth.getSession();

        let session =
        sessionResult.data?.session;

        /* اگر session نداریم، ورود ناشناس */
        if(!session){

            const anonymous =
            await sb.auth.signInAnonymously();

            if(anonymous.error){
                throw anonymous.error;
            }

            session =
            anonymous.data?.session;
        }

        if(!session){

            throw new Error(
                "ورود ناشناس انجام نشد. Anonymous Sign-Ins را در Supabase فعال کنید."
            );
        }

        const uid =
        session.user.id;


        /* جستجوی پروفایل */
        const existing =
        await sb
        .from("profiles")
        .select("*")
        .eq("id",uid)
        .maybeSingle();

        if(existing.error){
            throw existing.error;
        }


        let profile;


        /* پروفایل موجود است */
        if(existing.data){

            profile =
            existing.data;

            if(profile.is_banned){

                loginNotice.textContent =
                "این کاربر مسدود شده است.";

                return;
            }

            const updateData = {};

            if(profile.username !== username){
                updateData.username = username;
            }

            if(profile.display_name !== name){
                updateData.display_name = name;
            }

            if(Object.keys(updateData).length){

                const updated =
                await sb
                .from("profiles")
                .update(updateData)
                .eq("id",uid)
                .select("*")
                .single();

                if(updated.error){
                    throw updated.error;
                }

                profile =
                updated.data;
            }

        }

        /* ساخت پروفایل */
        else{

            const created =
            await sb
            .from("profiles")
            .insert({

                id:uid,

                username:username,

                display_name:name

            })
            .select("*")
            .single();

            if(created.error){
                throw created.error;
            }

            profile =
            created.data;
        }


        currentUser = {

            id:uid,

            name:
            profile.display_name || name,

            username:
            profile.username || username,

            verified:
            !!profile.is_verified,

            isOwner:
            !!profile.is_owner

        };


        /* نمایش برنامه */

        loginPage.classList.add("hidden");

        adminPage.classList.add("hidden");

        chatroomPage.classList.add("hidden");

        app.classList.remove("hidden");


        document
        .getElementById("currentUser")
        .textContent =
        "@" +
        currentUser.username +
        " — " +
        currentUser.name;


        document
        .getElementById("adminButton")
        .classList
        .toggle(
            "hidden",
            !currentUser.isOwner
        );


        loginNotice.textContent = "";


        /* بارگذاری اطلاعات */

        await loadTweetsFromDB();

        await loadChatsFromDB();

        subscribeRealtime();

    }

    catch(error){

        console.error(error);

        loginNotice.textContent =
        error.message ||
        "خطا در اتصال به Supabase.";

    }

    finally{

        button.disabled = false;

        button.textContent = "ثبت";

    }
}


/* ==============================
   TWEETS
============================== */

async function loadTweetsFromDB(){

    const result =
    await sb
    .from("tweets")
    .select(`
        id,
        author_id,
        content,
        image_url,
        created_at,
        profiles(
            username,
            display_name,
            is_verified
        )
    `)
    .order(
        "created_at",
        {ascending:true}
    );

    if(result.error){

        console.error(
            "Tweets:",
            result.error
        );

        renderTweets();

        return;
    }


    tweets =
    (result.data || []).map(item => ({

        id:item.id,

        author_id:item.author_id,

        name:
        item.profiles?.display_name ||
        "کاربر",

        username:
        item.profiles?.username ||
        "",

        verified:
        !!item.profiles?.is_verified,

        text:
        item.content || "",

        image_url:
        item.image_url || ""

    }));


    renderTweets();
}


/* ==============================
   ADD TWEET
============================== */

async function addTweet(){

    if(!currentUser){

        alert("ابتدا وارد حساب شوید.");

        return;
    }


    const input =
    document.getElementById("tweetInput");

    const text =
    input.value.trim();


    if(!text){

        alert("متن توییت را وارد کنید.");

        return;
    }


    const button =
    document.getElementById("tweetSendBtn");

    button.disabled = true;

    try{

        const result =
        await sb
        .from("tweets")
        .insert({

            author_id:
            currentUser.id,

            content:
            text

        });


        if(result.error){
            throw result.error;
        }


        input.value = "";

        await loadTweetsFromDB();

    }

    catch(error){

        console.error(error);

        alert(
            "ارسال توییت انجام نشد:\n" +
            error.message
        );

    }

    finally{

        button.disabled = false;

    }
}


/* ==============================
   IMAGE TWEET
============================== */

function chooseTweetImage(){

    document
    .getElementById("tweetImageInput")
    .click();

}


async function uploadTweetImage(){

    const input =
    document.getElementById("tweetImageInput");

    const file =
    input.files[0];

    if(!file){
        return;
    }


    document
    .getElementById("tweetFileName")
    .textContent =
    "در حال آپلود: " +
    file.name;


    if(!currentUser){

        alert("ابتدا وارد شوید.");

        return;
    }


    try{

        const extension =
        file.name
        .split(".")
        .pop()
        .toLowerCase();


        const filePath =
        "tweets/" +
        currentUser.id +
        "_" +
        Date.now() +
        "." +
        extension;


        const upload =
        await sb
        .storage
        .from("la3-media")
        .upload(
            filePath,
            file,
            {
                cacheControl:"3600",
                upsert:false
            }
        );


        if(upload.error){
            throw upload.error;
        }


        const publicUrl =
        sb
        .storage
        .from("la3-media")
        .getPublicUrl(filePath)
        .data
        .publicUrl;


        const text =
        document
        .getElementById("tweetInput")
        .value
        .trim();


        const inserted =
        await sb
        .from("tweets")
        .insert({

            author_id:
            currentUser.id,

            content:
            text || "📷 تصویر",

            image_url:
            publicUrl

        });


        if(inserted.error){
            throw inserted.error;
        }


        document
        .getElementById("tweetInput")
        .value = "";

        input.value = "";

        document
        .getElementById("tweetFileName")
        .textContent =
        "عکس با موفقیت ارسال شد ✅";


        await loadTweetsFromDB();

    }

    catch(error){

        console.error(error);

        document
        .getElementById("tweetFileName")
        .textContent = "";

        alert(
            "آپلود عکس انجام نشد:\n" +
            error.message
        );
    }
}


/* ==============================
   RENDER TWEETS
============================== */

function renderTweets(){

    const feed =
    document.getElementById("tweetFeed");


    if(!tweets.length){

        feed.innerHTML =
        '<div class="empty">هنوز توییتی وجود ندارد.</div>';

        return;
    }


    feed.innerHTML =
    tweets.map(tweet => `

        <div class="item">

            <div class="meta">

                <b>
                    ${clean(tweet.nam
