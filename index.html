<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LA3</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:#050505;
color:white;
font-family:tahoma;
}

.container{
max-width:450px;
margin:auto;
padding:20px;
}

.logo{
text-align:center;
font-size:55px;
font-weight:bold;
color:#38bdf8;
text-shadow:0 0 25px #2563eb;
}

.card{
background:#111827;
border-radius:30px;
padding:20px;
margin-top:20px;
border:1px solid #2563eb;
box-shadow:0 0 20px #1d4ed8;
}

.title{
font-size:22px;
color:#60a5fa;
}

.profile{
display:flex;
align-items:center;
gap:15px;
}

.avatar{
width:60px;
height:60px;
border-radius:50%;
background:#2563eb;
}

.tick{
color:#38bdf8;
}

.button{
background:#2563eb;
padding:15px;
border-radius:25px;
text-align:center;
margin-top:15px;
}

.bottom{
position:fixed;
bottom:15px;
left:20px;
right:20px;
background:#111827;
border-radius:35px;
display:flex;
justify-content:space-around;
padding:15px;
border:1px solid #38bdf8;
}

.item{
color:#93c5fd;
font-size:13px;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
LA3
</div>

<div class="card profile">
<div class="avatar"></div>

<div>
<h3>مالک LA3 <span class="tick">✔</span></h3>
<p>@LA3Official</p>
</div>

</div>


<div class="card">
<div class="title">کانال رسمی</div>
<p>آخرین پیام مالک در کانال رسمی</p>
</div>


<div class="card">
<div class="title">توییت</div>
<p>
به LA3 خوش آمدید 🌐
</p>
</div>


<div class="card">
<div class="title">📺 LAC</div>
<p>کانال‌های ساخته شده توسط مالک</p>
</div>


<div class="card">
<div class="title">📢 تبلیغات</div>
<p>بنر تبلیغاتی</p>
</div>


</div>


<div class="bottom">

<div class="item">🏠 خانه</div>
<div class="item">📝 توییت</div>
<div class="item">📺 LAC</div>
<div class="item">⚙️ تنظیمات</div>

</div>


</body>
</html>
