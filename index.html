<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LA3</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#030303;color:#fff;font-family:Tahoma,Arial,sans-serif}.hidden{display:none!important}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle,#171717,#000 70%)}
.card{width:min(430px,94vw);padding:25px;border:2px solid #08f;border-radius:22px;box-shadow:0 0 15px #08f,0 0 35px #08f5;background:#070707}
.logo{font-size:48px;text-align:center;font-weight:900;letter-spacing:5px;color:#f14;text-shadow:0 0 10px #f14,0 0 28px #f14}.sub{text-align:center;color:#aaa;margin:8px 0 25px}
label{display:block;margin:12px 0 7px;font-size:14px}input,textarea{width:100%;padding:13px;border:1px solid #08f;border-radius:11px;background:#020202;color:#fff;outline:none}textarea{min-height:80px;resize:vertical}
.btn{border:0;border-radius:11px;padding:12px 16px;background:#f14;color:#fff;font-weight:bold;cursor:pointer;box-shadow:0 0 12px #f14}.full{width:100%;margin-top:15px}.notice{text-align:center;color:#ff6580;min-height:22px;margin-top:10px;font-size:13px}
header{position:sticky;top:0;z-index:5;background:#050505ee;border-bottom:1px solid #f144;padding:12px}.head{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:30px;color:#f14;font-weight:900;text-shadow:0 0 10px #f14}
main{max-width:1000px;margin:auto;padding:18px}.ad{height:200px;border:1px solid #08f;border-radius:17px;overflow:hidden;box-shadow:0 0 18px #08f5}.slide{height:100%;display:none;position:relative}.slide.active{display:block}.slide img{width:100%;height:100%;object-fit:cover}.caption{position:absolute;bottom:0;left:0;right:0;padding:14px;background:linear-gradient(transparent,#000)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.panel{border:1px solid #f146;border-radius:17px;background:#080808;padding:15px}.panel h2{color:#08f;text-shadow:0 0 8px #08f}.actions{margin-top:8px}.small{box-shadow:none;border:1px solid #08f;background:#071019}.feed{max-height:430px;overflow:auto;margin-top:10px}.item{padding:12px 4px;border-top:1px solid #222}.meta{font-size:12px;color:#999;margin-bottom:6px}.verified{color:#08f;text-shadow:0 0 7px #08f}.message{white-space:pre-wrap;line-height:1.8}.item img{max-width:100%;border-radius:10px;margin-top:8px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.ad{height:170px}.brand{font-size:25px}}
</style>
</head>
<body>
<section id="login" class="login">
<div class="card"><div class="logo">LA3</div><div class="sub">ورود به سامانه</div>
<label>نام خود را وارد کنید</label><input id="name" maxlength="40" placeholder="نام شما">
<label>نام کاربری</label><input id="username" maxlength="30" placeholder="@username">
<button id="register" class="btn full">ثبت</button><div id="notice" class="notice"></div>
</div></section>

<section id="app" class="hidden">
<header><div class="head"><div class="brand">LA3</div><div id="user"></div></div></header>
<main><div id="ads" class="ad"></div><div class="grid">
<section class="panel"><h2>🐦 توییت‌ها</h2><textarea id="tweetText" placeholder="چه خبر؟"></textarea><div class="actions"><button id="tweetBtn" class="btn small">ارسال</button></div><div id="tweets" class="feed"></div></section>
<section class="panel">
<h2>💬 چتروم</h2>
<p style="color:#aaa;line-height:1.8">برای ورود به چتروم و گفتگو با کاربران، روی دکمه زیر بزنید.</p>
<button class="btn full" onclick="openChatroom()">ورود به چتروم</button>
</section>
</div></main></section>

<section id="chatroomPage" class="hidden" style="min-height:100vh;background:#030303">
<header><div class="head"><button class="btn small" onclick="closeChatroom()">← بازگشت</button><div class="brand">LA3 CHAT</div><div></div></div></header>
<main>
<div class="panel" style="max-width:850px;margin:auto">
<h2>💬 چتروم LA3</h2>
<div id="chat" class="feed" style="height:55vh;max-height:none"></div>
<textarea id="chatText" placeholder="پیام خود را بنویسید..."></textarea>
<div class="actions"><button id="chatBtn" class="btn small">ارسال پیام</button></div>
</div>
</main>
</section>

<script>
const URL="https://ibqhyqzolkzzpziocfvp.supabase.co";
const KEY="sb_publishable_vOId9lF-lt6wa4NdOdzDXg_ZRRelWUh";
const db=supabase.createClient(URL,KEY);let me;
const esc=s=>{let d=document.createElement("div");d.textContent=s??"";return d.innerHTML};

async function auth(){
 let {data:{session}}=await db.auth.getSession();
 if(!session){let r=await db.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session}
 return session.user
}
async function register(){
 try{
  const name=document.getElementById("name").value.trim(), username=document.getElementById("username").value.trim().replace(/^@/,"").toLowerCase();
  if(!name||!username)throw Error("نام و نام کاربری را وارد کنید.");
  document.getElementById("notice").textContent="در حال اتصال...";
  me=await auth();
  let {data:p}=await db.from("profiles").select("*").eq("id",me.id).maybeSingle();
  if(p?.is_banned)throw Error("این کاربر مسدود شده است.");
  let r=await db.from("profiles").upsert({id:me.id,username,display_name:name},{onConflict:"id"});
  if(r.error)throw r.error;
  let q=await db.from("profiles").select("*").eq("id",me.id).single();if(q.error)throw q.error;p=q.data;me.profile=p;
  document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");
  document.getElementById("user").textContent="@"+p.username+" — "+p.display_name;
  await loadAll();subscribe();
 }catch(e){document.getElementById("notice").textContent=e.message||"خطا در اتصال"}
}
document.getElementById("register").onclick=register;

function person(p){return "<b>"+esc(p?.display_name||"کاربر")+"</b> @"+esc(p?.username||"")+(p?.is_verified?'<span class="verified"> ✓</span>':"")}
function renderTweets(a){document.getElementById("tweets").innerHTML=a.length?a.map(x=>'<div class="item"><div class="meta">'+person(x.profiles)+'</div><div class="message">'+esc(x.content)+'</div>'+(x.image_url?'<img src="'+esc(x.image_url)+'">':"")+"</div>").join(""):'<div class="meta">هنوز توییتی وجود ندارد.</div>';document.getElementById("tweets").scrollTop=999999}
function renderChat(a){document.getElementById("chat").innerHTML=a.length?a.map(x=>'<div class="item"><div class="meta">'+person(x.profiles)+'</div><div class="message">'+esc(x.content)+'</div></div>').join(""):'<div class="meta">هنوز پیامی وجود ندارد.</div>';document.getElementById("chat").scrollTop=999999}
function renderAds(a){let e=document.getElementById("ads");if(!a.length){e.innerHTML='<div class="slide active"><div class="caption">تبلیغی ثبت نشده است.</div></div>';return}e.innerHTML=a.map((x,i)=>'<div class="slide '+(i?'':'active')+'">'+(x.image_url?'<img src="'+esc(x.image_url)+'">':"")+'<div class="caption">'+esc(x.title||"")+"</div></div>").join("");let i=0;setInterval(()=>{let s=e.querySelectorAll(".slide");if(s.length<2)return;s[i].classList.remove("active");i=(i+1)%s.length;s[i].classList.add("active")},4000)}
async function loadAll(){
 let [tw,ch,ad]=await Promise.all([
  db.from("tweets").select("id,author_id,content,image_url,created_at,profiles(username,display_name,is_verified)").order("created_at",{ascending:true}),
  db.from("chat_messages").select("id,author_id,content,image_url,created_at,profiles(username,display_name,is_verified)").order("created_at",{ascending:true}),
  db.from("ads").select("*").eq("is_active",true).order("created_at",{ascending:false})
 ]);
 renderTweets(tw.data||[]);renderChat(ch.data||[]);renderAds(ad.data||[]);
}
document.getElementById("tweetBtn").onclick=async()=>{let t=document.getElementById("tweetText"),v=t.value.trim();if(!v)return;let r=await db.from("tweets").insert({author_id:me.id,content:v});if(r.error)alert(r.error.message);else t.value=""};
document.getElementById("chatBtn").onclick=async()=>{
 let t=document.getElementById("chatText"),v=t.value.trim();if(!v)return;
 let r=await db.from("chat_messages").insert({author_id:me.id,content:v});
 if(r.error)alert(r.error.message);else{t.value="";renderChatroom()}
};
function openChatroom(){
 document.getElementById("app").classList.add("hidden");
 document.getElementById("chatroomPage").classList.remove("hidden");
 renderChatroom();
}
function closeChatroom(){
 document.getElementById("chatroomPage").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
}
function renderChatroom(){
 const el=document.getElementById("chat");
 db.from("chat_messages").select("id,author_id,content,image_url,created_at,profiles(username,display_name,is_verified)").order("created_at",{ascending:true}).then(r=>renderChat(r.data||[]));
}
function subscribe(){db.channel("la3-live").on("postgres_changes",{event:"*",schema:"public",table:"tweets"},loadAll).on("postgres_changes",{event:"*",schema:"public",table:"chat_messages"},loadAll).on("postgres_changes",{event:"*",schema:"public",table:"ads"},loadAll).subscribe()}
</script>
</body></html>
