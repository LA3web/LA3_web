<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA3</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#050505;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
    min-height:100vh;
}

.hidden{
    display:none !important;
}

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:radial-gradient(circle at 50% 30%,#151515,#000 70%);
}

.login-card{
    width:min(430px,94vw);
    padding:28px 22px;
    border:2px solid #00aaff;
    border-radius:22px;
    box-shadow:0 0 12px #00aaff,0 0 35px #004dff55;
    background:#080808;
}

.logo{
    text-align:center;
    font-size:48px;
    font-weight:900;
    letter-spacing:5px;
    color:#ff1744;
    text-shadow:0 0 8px #ff1744,0 0 28px #ff1744;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:28px;
}

.field{
    margin:15px 0;
}

.field label{
    display:block;
    margin-bottom:7px;
    color:#ddd;
    font-size:14px;
}

.field input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #00aaff;
    background:#050505;
    color:#fff;
    outline:none;
    font-size:16px;
}

.field input:focus{
    box-shadow:0 0 12px #00aaff;
}

.btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#ff1744;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 12px #ff1744;
    margin-top:10px;
}

.btn:active{
    transform:scale(.98);
}

.btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.notice{
    text-align:center;
    color:#ff607b;
    min-height:24px;
    margin-top:12px;
    font-size:13px;
    line-height:1.8;
    word-break:break-word;
}

.success{
    color:#00e676 !important;
}

.app{
    min-height:100vh;
}

header{
    position:sticky;
    top:0;
    z-index:10;
    background:#050505ee;
    border-bottom:1px solid #ff174455;
    backdrop-filter:blur(10px);
    padding:14px;
}

.header-inner{
    max-width:1000px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.brand{
    font-size:30px;
    font-weight:900;
    color:#ff1744;
    text-shadow:0 0 10px #ff1744;
}

.userbox{
    font-size:13px;
    color:#bbb;
}

.admin-btn{
    width:auto;
    padding:9px 14px;
    margin:0;
    font-size:13px;
}

main{
    max-width:1000px;
    margin:auto;
    padding:18px;
}

.ad-box{
    border:1px solid #00aaff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 0 18px #00aaff44;
    background:#080808;
}

.ad-slide{
    display:none;
    position:relative;
    height:210px;
}

.ad-slide.active{
    display:block;
}

.ad-slide img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.ad-caption{
    position:absolute;
    bottom:0;
    right:0;
    left:0;
    padding:14px;
    background:linear-gradient(transparent,#000d);
    font-weight:bold;
}

.dots{
    text-align:center;
    padding:9px;
}

.dot{
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#555;
    margin:0 4px;
}

.dot.active{
    background:#00aaff;
    box-shadow:0 0 8px #00aaff;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-top:18px;
}

.panel{
    background:#080808;
    border:1px solid #ff174466;
    border-radius:18px;
    padding:16px;
    box-shadow:0 0 18px #ff174422;
}

.panel h2{
    margin:0 0 15px;
    color:#00aaff;
    text-shadow:0 0 8px #00aaff;
    font-size:20px;
}

.compose textarea{
    width:100%;
    min-height:85px;
    resize:vertical;
    border:1px solid #333;
    background:#030303;
    color:#fff;
    border-radius:12px;
    padding:12px;
    outline:none;
    font-family:inherit;
}

.compose-actions{
    display:flex;
    gap:8px;
    margin-top:8px;
}

.small-btn{
    padding:10px 13px;
    border-radius:10px;
    border:1px solid #00aaff;
    background:#071019;
    color:#fff;
    cursor:pointer;
}

.small-btn:active{
    transform:scale(.97);
}

.feed{
    max-height:440px;
    overflow:auto;
    margin-top:12px;
}

.item{
    border-top:1px solid #222;
    padding:13px 4px;
}

.item:first-child{
    border-top:0;
}

.meta{
    font-size:12px;
    color:#888;
    margin-bottom:7px;
}

.verified{
    color:#00aaff;
    text-shadow:0 0 7px #00aaff;
}

.message{
    white-space:pre-wrap;
    line-height:1.8;
}

.empty{
    text-align:center;
    color:#666;
    padding:25px;
}

.admin-page{
    padding:18px;
}

.admin-panel{
    max-width:1000px;
    margin:auto;
    border:1px solid #00aaff;
    border-radius:18px;
    padding:18px;
    box-shadow:0 0 20px #00aaff33;
}

.back{
    margin-bottom:15px;
}

.glow{
    color:#ff1744;
    text-shadow:0 0 8px #ff1744,0 0 22px #ff1744;
}

@media(max-width:700px){
    .grid{
        grid-template-columns:1fr;
    }

    .header-inner{
        flex-wrap:wrap;
    }

    .brand{
        font-size:25px;
    }

    .ad-slide{
        height:170px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginPage" class="login-page">

    <div class="login-card">

        <div class="logo">LA3</div>

        <div class="subtitle">
            به سامانه LA3 خوش آمدید
        </div>

        <div class="field">
            <label for="name">نام خود را وارد کنید</label>
            <input
                id="name"
                type="text"
                maxlength="40"
                placeholder="نام شما"
            >
        </div>

        <div class="field">

            <input

                type="text"
                maxlength="30"
                placeholder="@username"
            >
        </div>

        <button id="registerButton" class="btn">
            ثبت
        </button>

        <div id="loginNotice" class="notice"></div>

    </div>

</section>


<!-- APP -->
<section id="app" class="app hidden">

<header>

    <div class="header-inner">

        <div class="brand">
            LA3
        </div>

        <div class="userbox" id="currentUser"></div>

    </div>

</header>


<main>

    <!-- ADS -->
    <div class="ad-box">

        <div class="ad-slide active">

            <img
                src="https://picsum.photos/1200/500?random=31"
                alt="تبلیغ"
            >

            <div class="ad-caption">
                تبلیغ شماره ۱
            </div>

        </div>


        <div class="ad-slide">

            <img
                src="https://picsum.photos/1200/500?random=32"
                alt="تبلیغ"
            >

            <div class="ad-caption">
                تبلیغ شماره ۲
            </div>

        </div>


        <div class="ad-slide">

            <img
                src="https://picsum.photos/1200/500?random=33"
                alt="تبلیغ"
            >

            <div class="ad-caption">
                تبلیغ شماره ۳
            </div>

        </div>


        <div class="dots">

            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>

        </div>

    </div>


    <!-- GRID -->
    <div class="grid">


        <!-- TWEETS -->
        <section class="panel">

            <h2>
                🐦 توییت‌ها
            </h2>

            <div class="compose">

                <textarea
                    id="tweetInput"
                    placeholder="چه خبر؟"
                ></textarea>

                <div class="compose-actions">

                    <button
                        id="tweetButton"

                    >
                        ارسال
                    </button>

                </div>

            </div>

            <div
                id="tweetFeed"

            ></div>

        </section>


        <!-- CHAT -->
        <section class="panel">

            <h2>

            </h2>

            <div style="color:#aaa;line-height:1.9;margin-bottom:12px">

                برای گفتگو با کاربران وارد صفحه اختصاصی چتروم شوید.

            </div>

            <button
                id="chatOpenButton"
                class="btn"
            >
                ورود به چتروم
            </button>

    </div>

</main>

</section>


<!-- CHATROOM -->
<section
    id="chatroomPage"
    class="admin-page hidden"
>

    <div
        class="admin-panel"
        style="max-width:850px"
    >

        <button
            id="chatBackButton"
            class="small-btn back"
        >
            ← بازگشت
        </button>

        <h2 class="glow">
            💬 چتروم LA3
        </h2>

        <div
            id="chatFeed"
            class="feed"
            style="max-height:55vh;margin-bottom:14px"
        ></div>

        <div class="compose">

            <textarea
                id="chatInput"
                placeholder="پیام خود را بنویسید..."
            ></textarea>

            <div class="compose-actions">

                <button
                    id="chatSendButton"
                    class="small-btn"
                >
                    ارسال پیام
                </button>

            </div>

        </div>

    </div>

</section>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://ibqhyqzolkzzpziocfvp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_vOId9lF-lt6wa4NdOdzDXg_ZRRelWUh";

let sb = null;
let currentUser = null;


/* =========================
   ELEMENTS
========================= */

const loginPage =
    document.getElementById("loginPage");

const app =
    document.getElementById("app");

const chatroomPage =
    document.getElementById("chatroomPage");

const registerButton =
    document.getElementById("registerButton");

const loginNotice =
    document.getElementById("loginNotice");

const nameInput =
    document.getElementById("name");

const usernameInput =
    document.getElementById("username");


/* =========================
   INITIALIZE
========================= */

function showNotice(message, success = false){

    loginNotice.textContent = message;

    loginNotice.classList.toggle(
        "success",
        success
    );
}


function initializeSupabase(){

    if(
        !window.supabase ||
        !window.supabase.createClient
    ){

        showNotice(
            "کتابخانه Supabase بارگذاری نشد. اینترنت یا VPN را بررسی کنید."
        );

        return false;
    }

    try{

        sb = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        return true;

    }catch(error){

        showNotice(
            "خطا در ساخت اتصال Supabase: " +
            error.message
        );

        return false;
    }
}


/* =========================
   REGISTER
========================= */

async function registerUser(){

    alert("دکمه کار کرد");
    
    console.log("REGISTER CLICKED");

    const name =
        nameInput.value.trim();

    const username =
        usernameInput.value
        .trim()
        .replace(/^@/, "")
        .toLowerCase();


    if(!name){

        showNotice(
            "لطفاً نام خود را وارد کنید."
        );

        nameInput.focus();

        return;
    }


    if(!username){

        showNotice(
            "لطفاً نام کاربری را وارد کنید."
        );

        usernameInput.focus();

        return;
    }


    if(username.length < 3){

        showNotice(
            "نام کاربری باید حداقل ۳ حرف داشته باشد."
        );

        return;
    }


    registerButton.disabled = true;

    registerButton.textContent =
        "در حال اتصال...";

    showNotice(
        "در حال اتصال به Supabase..."
    );


    try{

        /* اتصال */

        if(!sb){

            const ok =
                initializeSupabase();

            if(!ok){

                throw new Error(
                    "اتصال Supabase ساخته نشد."
                );
            }
        }


        /* گرفتن session */

        let sessionResult =
            await sb.auth.getSession();


        if(sessionResult.error){

            throw sessionResult.error;
        }


        let session =
            sessionResult.data.session;


        /* ورود ناشناس */

        if(!session){

            showNotice(
                "در حال ورود ناشناس..."
            );


            const authResult =
                await sb.auth.signInAnonymously({

                    options:{
                        data:{
                            display_name:name,
                            username:username
                        }
                    }

                });


            if(authResult.error){

                throw authResult.error;
            }


            session =
                authResult.data.session;


            if(!session){

                throw new Error(
                    "Supabase نشست کاربر را ایجاد نکرد."
                );
            }
        }


        const uid =
            session.user.id;


        showNotice(
            "ورود انجام شد؛ در حال ساخت پروفایل..."
        );


        /* =========================
           PROFILE
        ========================= */

        const profileResult =
            await sb
            .from("profiles")
            .upsert({

                id:uid,

                username:username,

                display_name:name

            },{
                onConflict:"id"
            })
            .select()
            .single();


        if(profileResult.error){

            throw new Error(
                "خطا در profiles: " +
                profileResult.error.message
            );
        }


        const profile =
            profileResult.data;


        if(profile.is_banned){

            throw new Error(
                "این حساب مسدود شده است."
            );
        }


        currentUser = {

            id:uid,

            name:
                profile.display_name || name,

            username:
                profile.username || username,

            verified:
                !!profile.is_verified

        };


        /* =========================
           SHOW APP
        ========================= */

        loginPage.classList.add(
            "hidden"
        );

        chatroomPage.classList.add(
            "hidden"
        );

        app.classList.remove(
            "hidden"
        );


        document.getElementById(
            "currentUser"
        ).textContent =
            "@" +
            currentUser.username +
            " — " +
            currentUser.name;


        showNotice(
            "ثبت با موفقیت انجام شد.",
            true
        );


        await loadTweets();

        await loadChats();


        console.log(
            "LOGIN SUCCESS",
            currentUser
        );


    }catch(error){

        console.error(
            "REGISTER ERROR:",
            error
        );


        showNotice(
            "خطا: " +
            (
                error?.message ||
                "خطای نامشخص"
            )
        );


    }finally{

        registerButton.disabled =
            false;

        registerButton.textContent =
            "ثبت";
    }
}


/* =========================
   TWEETS
========================= */

async function loadTweets(){

    if(!sb)return;


    const result =
        await sb
        .from("tweets")
        .select(`
            id,
            author_id,
            content,
            created_at,
            profiles(
                username,
                display_name,
                is_verified
            )
        `)
        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(result.error){

        console.error(
            "TWEETS ERROR:",
            result.error
        );

        return;
    }


    const tweets =
        result.data || [];


    const feed =
        document.getElementById(
            "tweetFeed"
        );


    if(!tweets.length){

        feed.innerHTML =
            '<div class="empty">هنوز توییتی وجود ندارد.</div>';

        return;
    }


    feed.innerHTML =
        tweets.map(tweet => {

            const profile =
                tweet.profiles || {};


            return `

                <div class="item">

                    <div class="meta">

                        <b>
                            ${escapeHTML(
                                profile.display_name ||
                                "کاربر"
                            )}
                        </b>

                        @${escapeHTML(
                            profile.username ||
                            ""
                        )}

                        ${
                            profile.is_verified
                            ?
                            '<span class="verified"> ✓ تیک آبی</span>'
                            :
                            ''
                        }

                    </div>

                    <div class="message">
                        ${escapeHTML(
                            tweet.content || ""
                        )}
                    </div>

                </div>

            `;

        }).join("");
}


async function addTweet(){

    if(!currentUser){

        alert(
            "ابتدا وارد حساب شوید."
        );

        return;
    }


    const input =
        document.getElementById(
            "tweetInput"
        );


    const text =
        input.value.trim();


    if(!text)return;


    const button =
        document.getElementById(
            "tweetButton"
        );


    button.disabled = true;


    try{

        const result =
            await sb
            .from("tweets")
            .insert({

                author_id:
                    currentUser.id,

                content:
                    text

            });


        if(result.error){

            throw result.error;
        }


        input.value = "";

        await loadTweets();


    }catch(error){

        alert(
            "ارسال توییت انجام نشد:\n" +
            error.message
        );


        console.error(error);


    }finally{

        button.disabled = false;
    }
}


/* =========================
   CHAT
========================= */

async function loadChats(){

    if(!sb)return;


    const result =
        await sb
        .from("chat_messages")
        .select(`
            id,
            author_id,
            content,
            created_at,
            profiles(
                username,
                display_name,
                is_verified
            )
        `)
        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(result.error){

        console.error(
            "CHAT ERROR:",
            result.error
        );

        return;
    }


    const chats =
        result.data || [];


    renderChats(chats);
}


function renderChats(chats){

    const feed =
        document.getElementById(
            "chatFeed"
        );


    if(!chats.length){

        feed.innerHTML =
            '<div class="empty">هنوز پیامی وجود ندارد.</div>';

        return;
    }


    feed.innerHTML =
        chats.map(chat => {

            const profile =
                chat.profiles || {};


            return `

                <div class="item">

                    <div class="meta">

                        <b>
                            ${escapeHTML(
                                profile.display_name ||
                                "کاربر"
