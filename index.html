<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LA3</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#050505;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
    min-height:100vh;
}

button,
input,
textarea{
    font-family:inherit;
}

.hidden{
    display:none!important;
}

.glow{
    color:#ff1744;
    text-shadow:0 0 8px #ff1744,0 0 22px #ff1744;
}

/* LOGIN */

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:radial-gradient(circle at 50% 30%,#151515,#000 70%);
}

.login-card{
    width:min(430px,94vw);
    padding:28px 22px;
    border:2px solid #00aaff;
    border-radius:22px;
    box-shadow:0 0 12px #00aaff,0 0 35px #004dff55;
    background:#080808;
}

.logo{
    text-align:center;
    font-size:48px;
    font-weight:900;
    letter-spacing:5px;
    color:#ff1744;
    text-shadow:0 0 8px #ff1744,0 0 28px #ff1744;
    margin:0 0 8px;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:28px;
}

.field{
    margin:15px 0;
}

.field label{
    display:block;
    margin-bottom:7px;
    color:#ddd;
    font-size:14px;
}

.field input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #00aaff;
    background:#050505;
    color:#fff;
    outline:none;
    box-shadow:inset 0 0 10px #00aaff22,0 0 8px #00aaff33;
}

.field input:focus{
    box-shadow:0 0 12px #00aaff;
}

.btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#ff1744;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 12px #ff1744;
    margin-top:10px;
}

.btn:hover{
    filter:brightness(1.15);
}

.btn:active{
    transform:scale(.98);
}

.notice{
    text-align:center;
    color:#ff607b;
    min-height:22px;
    margin-top:12px;
    font-size:13px;
}

/* APP */

.app{
    min-height:100vh;
}

header{
    position:sticky;
    top:0;
    z-index:10;
    background:#050505ee;
    border-bottom:1px solid #ff174455;
    backdrop-filter:blur(10px);
    padding:14px;
}

.header-inner{
    max-width:1000px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.brand{
    font-size:30px;
    font-weight:900;
    color:#ff1744;
    text-shadow:0 0 10px #ff1744;
}

.userbox{
    font-size:13px;
    color:#bbb;
}

.admin-btn{
    width:auto;
    padding:9px 14px;
    margin:0;
    font-size:13px;
}

main{
    max-width:1000px;
    margin:auto;
    padding:18px;
}

/* ADS */

.ad-box{
    border:1px solid #00aaff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 0 18px #00aaff44;
    background:#080808;
}

.ad-slide{
    display:none;
    position:relative;
    height:210px;
}

.ad-slide.active{
    display:block;
}

.ad-slide img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.ad-caption{
    position:absolute;
    bottom:0;
    right:0;
    left:0;
    padding:14px;
    background:linear-gradient(transparent,#000d);
    font-weight:bold;
}

.dots{
    text-align:center;
    padding:9px;
}

.dot{
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#555;
    margin:0 4px;
}

.dot.active{
    background:#00aaff;
    box-shadow:0 0 8px #00aaff;
}

/* PANELS */

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-top:18px;
}

.panel{
    background:#080808;
    border:1px solid #ff174466;
    border-radius:18px;
    padding:16px;
    box-shadow:0 0 18px #ff174422;
}

.panel h2{
    margin:0 0 15px;
    color:#00aaff;
    text-shadow:0 0 8px #00aaff;
    font-size:20px;
}

.compose textarea{
    width:100%;
    min-height:85px;
    resize:vertical;
    border:1px solid #333;
    background:#030303;
    color:#fff;
    border-radius:12px;
    padding:12px;
    outline:none;
}

.compose textarea:focus{
    border-color:#00aaff;
    box-shadow:0 0 10px #00aaff44;
}

.compose-actions{
    display:flex;
    gap:8px;
    margin-top:8px;
}

.small-btn{
    padding:10px 13px;
    border-radius:10px;
    border:1px solid #00aaff;
    background:#071019;
    color:#fff;
    cursor:pointer;
}

.small-btn:hover{
    background:#0b1c2b;
}

.small-btn:active{
    transform:scale(.97);
}

.feed{
    max-height:440px;
    overflow:auto;
    margin-top:12px;
}

.item{
    border-top:1px solid #222;
    padding:13px 4px;
}

.item:first-child{
    border-top:0;
}

.meta{
    font-size:12px;
    color:#888;
    margin-bottom:7px;
}

.verified{
    color:#00aaff;
    text-shadow:0 0 7px #00aaff;
}

.message{
    white-space:pre-wrap;
    line-height:1.8;
    word-break:break-word;
}

.empty{
    text-align:center;
    color:#666;
    padding:25px;
}

/* CHATROOM / ADMIN */

.admin-page{
    padding:18px;
    min-height:100vh;
}

.admin-panel{
    max-width:1000px;
    margin:auto;
    border:1px solid #00aaff;
    border-radius:18px;
    padding:18px;
    box-shadow:0 0 20px #00aaff33;
    background:#050505;
}

.admin-list{
    margin-top:15px;
}

.user-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px;
    border-bottom:1px solid #222;
}

.row-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.danger{
    border-color:#ff1744;
    background:#16050a;
}

.green{
    border-color:#00e676;
    background:#04150c;
}

.back{
    margin-bottom:15px;
}

/* STATUS */

.status{
    text-align:center;
    padding:10px;
    margin-top:10px;
    border-radius:10px;
    font-size:13px;
}

.status.error{
    color:#ff607b;
    background:#26050c;
}

.status.success{
    color:#00e676;
    background:#041a0c;
}

/* MOBILE */

@media(max-width:700px){

    .grid{
        grid-template-columns:1fr;
    }

    .header-inner{
        flex-wrap:wrap;
    }

    .brand{
        font-size:25px;
    }

    .ad-slide{
        height:170px;
    }

    .userbox{
        order:3;
        width:100%;
        text-align:center;
    }

}
</style>
</head>

<script>

"use strict";


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://ibqhyqzolkzzpziocfvp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_vOId9lF-lt6wa4NdOdzDXg_ZRRelWUh";


let sb = null;

try{

    if(
        window.supabase &&
        window.supabase.createClient
    ){

        sb = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

    }

}catch(error){

    console.error(
        "Supabase initialization error:",
        error
    );

}


/* =========================
   VARIABLES
========================= */

let currentUser = null;

let tweets = [];

let chats = [];

let realtimeChannel = null;


/* =========================
   HELPERS
========================= */

function clean(value){

    const div =
        document.createElement("div");

    div.textContent =
        value == null ? "" : String(value);

    return div.innerHTML;
}


function showNotice(message){

    const notice =
        document.getElementById(
            "loginNotice"
        );

    notice.textContent =
        message;
}


function setAdminStatus(
    message,
    type=""
){

    const box =
        document.getElementById(
            "adminStatus"
        );

    box.className =
        "status " + type;

    box.textContent =
        message;

    if(!message){
        box.className="";
    }

}


/* =========================
   LOGIN
========================= */

async function registerUser(){

    const name =
        document
        .getElementById("name")
        .value
        .trim();

    const username =
        document
        .getElementById("username")
        .value
        .trim()
        .replace(/^@/,"")
        .toLowerCase();

    if(!name || !username){

        showNotice(
            "لطفاً نام و نام کاربری را وارد کنید."
        );

        return;
    }


    if(!sb){

        showNotice(
            "اتصال به Supabase برقرار نشده است."
        );

        return;
    }


    showNotice(
        "در حال ورود..."
    );


    try{

        let sessionData =
            await sb.auth.getSession();

        let session =
            sessionData?.data?.session;


        /*
         Anonymous authentication
        */

        if(!session){

            const result =
                await sb.auth.signInAnonymously();

            if(result.error){

                throw result.error;

            }

            session =
                result.data.session;

        }


        if(!session){

            throw new Error(
                "جلسه کاربر ایجاد نشد."
            );

        }


        const uid =
            session.user.id;


        /*
         Find profile
        */

        const profileResult =
            await sb
            .from("profiles")
            .select("*")
            .eq("id",uid)
            .maybeSingle();


        if(profileResult.error){

            throw profileResult.error;

        }


        let profile =
            profileResult.data;


        /*
         Create profile
        */

        if(!profile){

            const insertResult =
                await sb
                .from("profiles")
                .insert({

                    id:uid,

                    username:username,

                    display_name:name

                })
                .select("*")
                .single();


            if(insertResult.error){

                throw insertResult.error;

            }


            profile =
                insertResult.data;

        }else{


            /*
             Update user's own profile
            */

            if(
                profile.username !== username ||
                profile.display_name !== name
            ){

                const updateResult =
                    await sb
                    .from("profiles")
                    .update({

                        username:username,

                        display_name:name

                    })
                    .eq("id",uid);


                if(updateResult.error){

                    throw updateResult.error;

                }


                profile = {

                    ...profile,

                    username:username,

                    display_name:name

                };

            }

        }


        /*
         Ban check
        */

        if(
            profile.is_banned === true
        ){

            showNotice(
                "این کاربر مسدود شده است."
            );

            return;

        }


        currentUser = {

            id:uid,

            name:
                profile.display_name,

            username:
                profile.username,

            verified:
                !!profile.is_verified,

            isOwner:
                !!profile.is_owner

        };


        /*
         Show app
        */

        document
        .getElementById("loginPage")
        .classList
        .add("hidden");


        document
        .getElementById("adminPage")
        .classList
        .add("hidden");


        document
        .getElementById("chatroomPage")
        .classList
        .add("hidden");


        document
        .getElementById("app")
        .classList
        .remove("hidden");


        document
        .getElementById("currentUser")
        .textContent =
            "@" +
            profile.username +
            " — " +
            profile.display_name;


        document
        .getElementById("adminButton")
        .classList
        .toggle(
            "hidden",
            !profile.is_owner
        );


        await loadTweetsFromDB();

        await loadChatsFromDB();

        subscribeRealtime();


        showNotice("");

    }catch(error){

        console.error(error);

        showNotice(
            error.message ||
            "خطا در اتصال به Supabase."
        );

    }

}


/* =========================
   LOAD TWEETS
========================= */

async function loadTweetsFromDB(){

    if(!sb) return;


    const result =
        await sb
        .from("tweets")
        .select(`
            id,
            author_id,
            content,
            image_url,
            created_at,
            profiles(
                username,
                display_name,
                is_verified
            )
        `)
        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(result.error){

        console.error(
            "Tweets:",
            result.error
        );

        renderTweets();

        return;
    }


    tweets =
        (result.data || [])
        .map(item => ({

            id:item.id,

            author_id:
                item.author_id,

            name:
                item.profiles?.display_name ||
                "کاربر",

            username:
                item.profiles?.username ||
                "",

            verified:
                !!item.profiles?.is_verified,

            text:
                item.content || "",

            image_url:
                item.image_url || ""

        }));


    renderTweets();

}

   LOAD CHAT

    if(!sb) return;


    const result =

            content,
            image_url,
            created_at,
            profiles(
                username,
                display_name,
                is_verified
            )
        `)
        .order(
            "created_at",
            {
                ascending:true
