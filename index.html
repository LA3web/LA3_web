<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LA3</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:Tahoma,Arial,sans-serif;
  min-height:100vh
}

.hidden{display:none!important}

.glow{
  color:#ff1744;
  text-shadow:0 0 8px #ff1744,0 0 22px #ff1744
}

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:radial-gradient(circle at 50% 30%,#151515,#000 70%)
}

.login-card{
  width:min(430px,94vw);
  padding:28px 22px;
  border:2px solid #00aaff;
  border-radius:22px;
  box-shadow:0 0 12px #00aaff,0 0 35px #004dff55;
  background:#080808
}

.logo{
  text-align:center;
  font-size:48px;
  font-weight:900;
  letter-spacing:5px;
  color:#ff1744;
  text-shadow:0 0 8px #ff1744,0 0 28px #ff1744;
  margin:0 0 8px
}

.subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:28px
}

.field{margin:15px 0}

.field label{
  display:block;
  margin-bottom:7px;
  color:#ddd;
  font-size:14px
}

.field input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #00aaff;
  background:#050505;
  color:#fff;
  outline:none;
  box-shadow:inset 0 0 10px #00aaff22,0 0 8px #00aaff33
}

.field input:focus{
  box-shadow:0 0 12px #00aaff
}

.btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#ff1744;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 12px #ff1744;
  margin-top:10px
}

.btn:hover{filter:brightness(1.15)}

.notice{
  text-align:center;
  color:#ff607b;
  min-height:22px;
  margin-top:12px;
  font-size:13px
}

.app{min-height:100vh}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#050505ee;
  border-bottom:1px solid #ff174455;
  backdrop-filter:blur(10px);
  padding:14px
}

.header-inner{
  max-width:1000px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px
}

.brand{
  font-size:30px;
  font-weight:900;
  color:#ff1744;
  text-shadow:0 0 10px #ff1744
}

.userbox{
  font-size:13px;
  color:#bbb;
  flex:1;
  text-align:center
}

.admin-btn{
  width:auto;
  padding:9px 14px;
  margin:0;
  font-size:13px
}

main{
  max-width:1000px;
  margin:auto;
  padding:18px
}

.ad-box{
  border:1px solid #00aaff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 0 18px #00aaff44;
  background:#080808
}

.ad-slide{
  display:none;
  position:relative;
  height:210px
}

.ad-slide.active{display:block}

.ad-slide img{
  width:100%;
  height:100%;
  object-fit:cover
}

.ad-caption{
  position:absolute;
  bottom:0;
  right:0;
  left:0;
  padding:14px;
  background:linear-gradient(transparent,#000d);
  font-weight:bold
}

.dots{
  text-align:center;
  padding:9px
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#555;
  margin:0 4px
}

.dot.active{
  background:#00aaff;
  box-shadow:0 0 8px #00aaff
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-top:18px
}

.panel{
  background:#080808;
  border:1px solid #ff174466;
  border-radius:18px;
  padding:16px;
  box-shadow:0 0 18px #ff174422
}

.panel h2{
  margin:0 0 15px;
  color:#00aaff;
  text-shadow:0 0 8px #00aaff;
  font-size:20px
}

.compose textarea{
  width:100%;
  min-height:85px;
  resize:vertical;
  border:1px solid #333;
  background:#030303;
  color:#fff;
  border-radius:12px;
  padding:12px;
  outline:none
}

.compose textarea:focus{
  border-color:#00aaff;
  box-shadow:0 0 10px #00aaff44
}

.compose-actions{
  display:flex;
  gap:8px;
  margin-top:8px
}

.small-btn{
  padding:10px 13px;
  border-radius:10px;
  border:1px solid #00aaff;
  background:#071019;
  color:#fff;
  cursor:pointer
}

.small-btn:hover{
  box-shadow:0 0 10px #00aaff55
}

.feed{
  max-height:440px;
  overflow:auto;
  margin-top:12px
}

.item{
  border-top:1px solid #222;
  padding:13px 4px
}

.item:first-child{border-top:0}

.meta{
  font-size:12px;
  color:#888;
  margin-bottom:7px
}

.verified{
  color:#00aaff;
  text-shadow:0 0 7px #00aaff
}

.message{
  white-space:pre-wrap;
  line-height:1.8
}

.post-image{
  display:block;
  width:100%;
  max-height:400px;
  object-fit:contain;
  margin-top:10px;
  border-radius:12px;
  border:1px solid #00aaff55;
  background:#000
}

.empty{
  text-align:center;
  color:#666;
  padding:25px
}

.admin-page{
  padding:18px
}

.admin-panel{
  max-width:1000px;
  margin:auto;
  border:1px solid #00aaff;
  border-radius:18px;
  padding:18px;
  box-shadow:0 0 20px #00aaff33
}

.admin-list{margin-top:15px}

.user-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px;
  border-bottom:1px solid #222
}

.row-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap
}

.danger{
  border-color:#ff1744;
  background:#16050a
}

.green{
  border-color:#00e676;
  background:#04150c
}

.back{margin-bottom:15px}

.chat-title{
  font-size:22px;
  margin-bottom:15px
}

.upload-label{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:10px 13px;
  border-radius:10px;
  border:1px solid #00aaff;
  background:#071019;
  color:#fff;
  cursor:pointer
}

.upload-label:hover{
  box-shadow:0 0 10px #00aaff55
}

.selected-file{
  color:#00aaff;
  font-size:12px;
  margin-top:7px;
  min-height:18px
}

@media(max-width:700px){
  .grid{grid-template-columns:1fr}

  .header-inner{
    flex-wrap:wrap
  }

  .brand{font-size:25px}

  .userbox{
    order:3;
    flex-basis:100%
  }

  .ad-slide{height:170px}

  .compose-actions{
    flex-wrap:wrap
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginPage" class="login-page">
  <div class="login-card">

    <div class="logo">LA3</div>

    <div class="subtitle">
      به سامانه LA3 خوش آمدید
    </div>

    <div class="field">
      <label for="name">نام خود را وارد کنید</label>
      <input
        id="name"
        type="text"
        maxlength="40"

      >
    </div>

    <div class="field">
      <label for="username">نام کاربری</label>
      <input

        type="text"

    </div>

    <div class="field" id="ownerPasswordBox">

<!-- APP -->
<section id="app" class="app hidden">

<header>
  <div class="header-inner">

    <button
      id="adminButton"

</header>


<main>

  <!-- ADS -->
  <div class="ad-box">

    <div class="ad-slide active">
      <img
        src="https://picsum.photos/1200/500?random=31"
        alt="تبلیغ"
      >

      <div class="ad-caption">
        تبلیغ شماره ۱ — تصویر تبلیغاتی خودت را اینجا قرار بده
      </div>
    </div>


    <div class="ad-slide">
      <img
        src="https://picsum.photos/1200/500?random=32"
        alt="تبلیغ"
      >

      <div class="ad-caption">
        تبلیغ شماره ۲
      </div>
    </div>


    <div class="ad-slide">
      <img
        src="https://picsum.photos/1200/500?random=33"
        alt="تبلیغ"
      >

      <div class="ad-caption">
        تبلیغ شماره ۳
      </div>
    </div>


    <div class="dots">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

  <!-- GRID -->
  <div class="grid">

</section>


<!-- CHATROOM -->
<section

<!-- ADMIN -->

    </p>

      class="admin-list"
    ></div>

  </div>

</section>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://ibqhyqzolkzzpziocfvp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_vOId9lF-lt6wa4NdOdzDXg_ZRRelWUh";

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const OWNER_PASSWORD = "";

let currentUser = null;


let demoUsers = [
  {
    name:"کاربر نمونه",
    username:"sample",
    verified:true,
    banned:false
  },
  {
    name:"علی",
    username:"ali",
    verified:false,
    banned:false
  }
];


let tweets = [];

let chats = [];

let realtimeChannel = null;


/* =========================
   امنیت نمایش متن
========================= */

function clean(s){

  if(s === null || s === undefined){
    return "";
  }

  const d = document.createElement("div");

  d.textContent = String(s);

  return d.innerHTML;
}


/* =========================
   LOGIN
========================= */

async function registerUser(){

  const name =
    document
      .getElementById("name")
      .value
      .trim();

  const username =
    document
      .getElementById("username")
      .value
      .trim()
      .replace(/^@/,"")
      .toLowerCase();

  const notice =
    document.getElementById("loginNotice");


  if(!name || !username){

    notice.textContent =
      "لطفاً نام و نام کاربری را وارد کنید.";

    return;
  }


  if(username.length < 3){

    notice.textContent =
      "نام کاربری باید حداقل ۳ حرف باشد.";

    return;
  }


  notice.textContent =
    "در حال اتصال...";


  try{

    let sessionData =
      await sb.auth.getSession();

    let session =
      sessionData.data.session;


    if(!session){

      const r =
        await sb.auth.signInAnonymously();

      if(r.error){
        throw r.error;
      }

      session =
        r.data.session;
    }


    if(!session){

      throw new Error(
        "نشست کاربری ایجاد نشد."
      );
    }


    const uid =
      session.user.id;


    const existing =
      await sb
        .from("profiles")
        .select("*")
        .eq("id",uid)
        .maybeSingle();


    if(existing.error){
      throw existing.error;
    }


    if(existing.data?.is_banned){

      notice.textContent =
        "این کاربر مسدود شده است.";

      return;
    }


    let profile =
      existing.data;


    if(profile){

      if(
        profile.username !== username ||
        profile.display_name !== name
      ){

        const r =
          await sb
            .from("profiles")
            .update({
              username:username,
              display_name:name
            })
            .eq("id",uid);


        if(r.error){
          throw r.error;
        }


        profile = {
          ...profile,
          username:username,
          display_name:name
        };
      }

    }else{

      const r =
        await sb
          .from("profiles")
          .insert({
            id:uid,
            username:username,
            display_name:name
          })
          .select("*")
          .single();


      if(r.error){
        throw r.error;
      }


      profile =
        r.data;
    }


    currentUser = {

      id:uid,

      name:
        profile.display_name,

      username:
        profile.username,

      verified:
        !!profile.is_verified,

      isOwner:
        !!profile.is_owner

    };


    document
      .getElementById("loginPage")
      .classList
      .add("hidden");


    document
      .getElementById("adminPage")
      .classList
      .add("hidden");


    document
      .getElementById("chatroomPage")
      .classList
      .add("hidden");


    document
      .getElementById("app")
      .classList
      .remove("hidden");


    document
      .getElementById("currentUser")
      .textContent =
        "@" +
        profile.username +
        " — " +
        profile.display_name;


    document
      .getElementById("adminButton")
      .classList
      .toggle(
        "hidden",
        !profile.is_owner
      );


    await loadTweetsFromDB();

    await loadChatsFromDB();

    subscribeRealtime();

  }catch(e){

    console.error(e);

    notice.textContent =
      e.message ||
      "خطا در اتصال به Supabase.";

  }

}


/* =========================
   TWEETS
========================= */

async function loadTweetsFromDB(){

  const r =
    await sb
      .from("tweets")
      .select(
        "id,author_id,content,image_url,created_at,profiles(username,display_name,is_verified)"
      )
      .order(
        "created_at",
        {ascending:true}
      );


  if(r.error){

    console.error(
      "loadTweets:",
      r.error
    );

    return;
  }


  tweets =
    (r.data || []).map(x => ({

      id:
        x.id,

      author_id:
        x.author_id,

      name:
        x.profiles?.display_name ||
        "کاربر",

      username:
        x.profiles?.username ||
        "",

      verified:
        !!x.profiles?.is_verified,

      text:
        x.content ||
        "",

      image_url:
        x.image_url ||
        ""

    }));


  renderTweets();
}


/* =========================
   ارسال توییت متنی
========================= */

async function addTweet(){

  if(!currentUser){

    alert(
      "ابتدا وارد حساب شوید."
    );

    return;
  }


  const input =
    document.getElementById(
      "tweetInput"
    );


  const text =
    input.value.trim();


  const imageInput =
    document.getElementById(
      "tweetImage"
    );


  const file =
    imageInput.files[0];


  if(!text && !file){

    alert(
      "متن یا عکس را وارد کنید."
    );

    return;
  }


  try{

    let imageUrl = null;


    /* =====================
       آپلود عکس
    ===================== */

    if(file){

      if(
        !file.type.startsWith("image/")
      ){

        alert(
          "لطفاً فقط فایل تصویری انتخاب کنید."
        );

        return;
      }


      if(
        file.size >
        10 * 1024 * 1024
      ){

        alert(
          "حجم عکس نباید بیشتر از ۱۰ مگابایت باشد."
        );

        return;
      }


      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      let uniqueId;


      if(
        window.crypto &&
        crypto.randomUUID
      ){

        uniqueId =
          crypto.randomUUID();

      }else{

        uniqueId =
          Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .substring(2);

      }


      const filePath =
        currentUser.id +
        "/" +
        Date.now() +
        "-" +
        uniqueId +
        "." +
        extension;


      const upload =
        await sb.storage
          .from("la3-media")
          .upload(
            filePath,
            file,
            {
              cacheControl:"3600",
              upsert:false,
              contentType:file.type
            }
          );


      if(upload.error){

        throw upload.error;
      }


      const urlData =
        sb.storage
          .from("la3-media")
          .getPublicUrl(
            filePath
          );


      imageUrl =
        urlData.data.publicUrl;

    }


    /* =====================
       ذخیره توییت
    ===================== */

    const r =
      await sb
        .from("tweets")
        .insert({

          author_id:
            currentUser.id,

          content:
            text,

          image_url:
            imageUrl

        });


    if(r.error){

      throw r.error;
    }


    input.value = "";

    imageInput.value = "";

    document
      .getElementById(
        "selectedTweetFile"
      )
      .textContent = "";


    await loadTweetsFromDB();


  }catch(e){

    console.error(e);

    alert(
      "ارسال توییت انجام نشد:\n" +
      e.message
    );

  }

}


/* =========================
   نمایش توییت‌ها
========================= */

function renderTweets(){

  const feed =
    document.getElementById(
      "tweetFeed"
    );


  if(!tweets.length){

    feed.innerHTML =
      '<div class="empty">هنوز توییتی وجود ندارد.</div>';

    return;
  }


  feed.innerHTML =
    tweets.map(t => `

      <div class="item">

        <div class="meta">

          <b>
            ${clean(t.name)}
          </b>

          @${clean(t.username)}

          ${
            t.verified
            ?
            '<span class="verified"> ✓ تیک آبی</span>'
            :
            ''
          }

        </div>


        ${
          t.text
          ?
          `<div class="message">
            ${clean(t.text)}
          </div>`
          :
          ''
        }


        ${
          t.image_url
          ?
          `
          <img
            class="post-image"
            src="${clean(t.image_url)}"
            alt="تصویر توییت"
            loading="lazy"
            onerror="this.style.display='none'"
          >
          `
          :
          ''
        }

      </div>

    `).join("");


  feed.scrollTop =
    feed.scrollHeight;
}


/* =========================
   انتخاب عکس
========================= */

document
  .getElementById("tweetImage")
  .addEventListener(
    "change",
    function(){

      const file =
        this.files[0];

      const label =
        document.getElementById(
          "selectedTweetFile"
        );


      if(file){

        label.textContent =
          "📷 " +
          file.name;

      }else{

        label.textContent =
          "";

      }

    }
  );


/* =========================
   CHAT
