<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LA3 - خاموشی سایت</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, #18243d 0%, #080b14 45%, #030407 100%);
      color: #ffffff;
      font-family: Tahoma, Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      padding: 42px 28px;
      border: 2px solid #168cff;
      border-radius: 22px;
      background: rgba(5, 10, 22, 0.88);
      box-shadow:
        0 0 18px rgba(0, 140, 255, 0.45),
        inset 0 0 25px rgba(0, 140, 255, 0.08);
    }

    .logo {
      margin-bottom: 28px;
      font-size: clamp(42px, 10vw, 90px);
      font-weight: 900;
      letter-spacing: 6px;
      color: #168cff;
      text-shadow: 0 0 12px #168cff, 0 0 30px #0759a8;
    }

    .message {
      margin: 0 auto 28px;
      font-size: clamp(24px, 4vw, 48px);
      line-height: 1.8;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
    }

    .details {
      font-size: clamp(18px, 2.8vw, 28px);
      line-height: 2;
      color: #cbd5e1;
    }

    .username {
      display: inline-block;
      margin-top: 10px;
      direction: ltr;
      color: #ff334d;
      font-weight: bold;
      text-shadow: 0 0 12px rgba(255, 51, 77, 0.7);
    }

    .footer {
      margin-top: 34px;
      color: #168cff;
      font-size: clamp(16px, 2.2vw, 22px);
      font-weight: bold;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 18px;
      }

      .logo {
        letter-spacing: 3px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo">LA3</div>

    <h1 class="message">
      سایت LA3 به دلایلی خاموش شده است
    </h1>

    <div class="details">
      برای اطلاعات بیشتر به این آیدی در روبیکا مراجعه کنید:
      <br>
      <span class="username">@LA3_1213</span>
    </div>

    <div class="footer">
      با تشکر تیم LA3
    </div>
  </main>
</body>
</html>
